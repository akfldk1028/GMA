name: gma_frontend
description: "GMA - PDF-Linked Markdown Annotation App"
publish_to: 'none'
version: 1.0.11+13

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  # UI
  shadcn_ui: ^0.45.1
  cupertino_icons: ^1.0.8
  lucide_icons_flutter: ^3.1.9

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # PDF Viewer
  pdfrx: ^2.2.0

  # Local Storage
  hive_flutter: ^1.1.0

  # Model
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Markdown
  markdown: ^7.2.2
  markdown_widget: ^2.3.2+6
  flutter_math_fork: ^0.7.2

  # File System
  path_provider: ^2.1.4
  path: ^1.9.0
  file_picker: ^8.1.6

  # Drawing
  perfect_freehand: ^2.5.2+1

  # HTTP
  http: ^1.2.0

  # AI (On-Device)
  flutter_gemma: ^0.13.2

  # Logging
  talker_flutter: ^4.7.0
  talker_riverpod_logger: ^4.7.0

  # Math
  vector_math: ^2.1.4

  # Utils
  uuid: ^4.5.1
  yaml: ^3.1.2
  intl: ^0.20.2
  marionette_flutter: ^0.3.0

  # Device Preview
  device_preview: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.1

  # Code Generation
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.2
  flutter_launcher_icons: ^0.14.3
  msix: ^3.16.8

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  windows:
    generate: true
    icon_size: 48
    image_path: "assets/icon/app_icon.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"

msix_config:
  display_name: GMA
  publisher_display_name: GMA
  identity_name: com.gma.frontend
  msix_version: 1.0.9.0
  logo_path: assets/icon/app_icon.png
  capabilities: internetClient
  output_name: GMA_v1.0.9

flutter:
  uses-material-design: true
  assets:
    - assets/sample/
    - assets/logo.png
    - assets/icon/
    - assets/brand/
