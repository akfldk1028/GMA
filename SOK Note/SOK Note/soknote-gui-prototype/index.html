<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>쏙 노트 — GUI 프로토타입</title>
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>

<div class="device-frame">
<div class="app-shell">

  <!-- ══════════════════════════
       사이드바 (단일 통합 컴포넌트)
       축소: 64px (아이콘만)
       확장: 312px (아이콘 + 레이블)
  ══════════════════════════ -->
  <aside class="app-sidebar">

    <!-- 헤더: 토글 버튼 + 앱 이름 -->
    <div class="app-sidebar__header">
      <button class="sidebar-toggle-btn" aria-label="사이드바 열기/닫기">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <rect x="2" y="5"  width="16" height="1.6" rx="0.8" fill="currentColor"/>
          <rect x="2" y="9"  width="16" height="1.6" rx="0.8" fill="currentColor"/>
          <rect x="2" y="13" width="16" height="1.6" rx="0.8" fill="currentColor"/>
        </svg>
      </button>
      <img class="app-sidebar__logo" src="assets/images/logo.png" alt="쏙 노트" />
    </div>

    <!-- 내비게이션 -->
    <nav class="app-sidebar__nav" aria-label="메인 메뉴">
      <a href="#" class="sidebar-nav__item sidebar-nav__item--active" aria-current="page">
        <span class="sidebar-nav__icon-wrap">
          <svg class="sidebar-nav__icon" viewBox="0 0 20 20" fill="none">
            <rect x="3" y="2" width="14" height="16" rx="2" fill="currentColor"/>
            <line x1="6" y1="6.5"  x2="14" y2="6.5"  stroke="white" stroke-width="1.3" stroke-linecap="round"/>
            <line x1="6" y1="10"   x2="14" y2="10"    stroke="white" stroke-width="1.3" stroke-linecap="round"/>
            <line x1="6" y1="13.5" x2="10" y2="13.5"  stroke="white" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="sidebar-nav__label">모든 노트</span>
      </a>
      <a href="#" class="sidebar-nav__item">
        <span class="sidebar-nav__icon-wrap">
          <svg class="sidebar-nav__icon" viewBox="0 0 20 20" fill="none">
            <polyline points="3,5 17,5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M7 5V4a1 1 0 011-1h4a1 1 0 011 1v1" stroke="currentColor" stroke-width="1.5"/>
            <rect x="4" y="5" width="12" height="12" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
            <line x1="8"  y1="9" x2="8"  y2="14" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            <line x1="12" y1="9" x2="12" y2="14" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="sidebar-nav__label">휴지통</span>
      </a>
      <a href="#" class="sidebar-nav__item">
        <span class="sidebar-nav__icon-wrap">
          <svg class="sidebar-nav__icon" viewBox="0 0 20 20" fill="none">
            <path d="M2 6a2 2 0 012-2h4l2 2h6a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z" stroke="currentColor" stroke-width="1.5"/>
          </svg>
        </span>
        <span class="sidebar-nav__label">폴더</span>
      </a>
    </nav>

  </aside>

  <!-- ══════════════════════════
       메인 영역
  ══════════════════════════ -->
  <div class="app-main">

    <!-- 앱바 (기본 상태) -->
    <header class="appbar">
      <h1 class="appbar__title">모든 노트</h1>
      <div class="appbar__actions">
        <button class="appbar__icon-btn" aria-label="새 노트">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
            <rect x="3" y="2" width="13" height="16" rx="2" stroke="currentColor" stroke-width="1.5"/>
            <line x1="6" y1="7"  x2="13" y2="7"  stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            <line x1="6" y1="10" x2="13" y2="10" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            <line x1="6" y1="13" x2="10" y2="13" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            <circle cx="17" cy="17" r="4" fill="currentColor"/>
            <line x1="15" y1="17" x2="19" y2="17" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="17" y1="15" x2="17" y2="19" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
        <button class="appbar__icon-btn" aria-label="보기 전환">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
            <rect x="2"  y="2"  width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
            <rect x="12" y="2"  width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
            <rect x="2"  y="12" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
            <rect x="12" y="12" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
          </svg>
        </button>
        <button class="appbar__icon-btn" data-action="search" aria-label="검색">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
            <circle cx="9.5" cy="9.5" r="6" stroke="currentColor" stroke-width="1.5"/>
            <line x1="14" y1="14" x2="19" y2="19" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
        <button class="appbar__icon-btn" data-action="more" aria-label="더 보기">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
            <circle cx="11" cy="5"  r="1.5" fill="currentColor"/>
            <circle cx="11" cy="11" r="1.5" fill="currentColor"/>
            <circle cx="11" cy="17" r="1.5" fill="currentColor"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- 검색 앱바 (검색 활성 상태) -->
    <div class="search-appbar">
      <button class="search-appbar__back-btn" aria-label="뒤로">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
          <polyline points="14,5 8,11 14,17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <input class="search-appbar__input" type="search" placeholder="노트 검색..." aria-label="노트 검색"/>
    </div>

    <!-- 정렬 바 -->
    <div class="sort-bar">
      <div class="sort-bar__wrap">
        <button class="sort-bar__btn" data-action="sort" aria-haspopup="listbox">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <line x1="1" y1="3"  x2="13" y2="3"  stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            <line x1="3" y1="7"  x2="11" y2="7"  stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            <line x1="5" y1="11" x2="9"  y2="11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
          <span class="sort-bar__label">생성일 (최신순)</span>
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <polyline points="3,5 7,9 11,5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <!-- 정렬 드롭다운 -->
        <div class="sort-dropdown" role="listbox">
          <button class="sort-dropdown__item sort-dropdown__item--active" role="option" data-sort="created-newest">생성일 (최신순)</button>
          <button class="sort-dropdown__item" role="option" data-sort="created-oldest">생성일 (오래된순)</button>
          <button class="sort-dropdown__item" role="option" data-sort="modified-newest">수정일 (최신순)</button>
          <button class="sort-dropdown__item" role="option" data-sort="modified-oldest">수정일 (오래된순)</button>
          <button class="sort-dropdown__item" role="option" data-sort="title-asc">제목 (가나다순)</button>
          <button class="sort-dropdown__item" role="option" data-sort="title-desc">제목 (가나다 역순)</button>
        </div>
      </div>
    </div>

    <!-- 노트 그리드 -->
    <main class="screen">
      <img class="screen-deco" src="assets/images/deco.png" alt="" aria-hidden="true" />
      <div class="note-grid">

        <article class="note-card">
          <div class="note-card__thumbnail note-card__thumbnail--dark">
            <div class="note-card__thumbnail-lines">
              <div class="thumbnail-line thumbnail-line--title thumbnail-line--w-72"></div>
              <div class="thumbnail-line thumbnail-line--w-55"></div>
              <div class="thumbnail-line thumbnail-line--w-80 thumbnail-line--opacity-25"></div>
              <div class="thumbnail-line thumbnail-line--w-65 thumbnail-line--opacity-20"></div>
              <div class="thumbnail-line thumbnail-line--w-75 thumbnail-line--opacity-20"></div>
              <div class="thumbnail-line thumbnail-line--w-50 thumbnail-line--opacity-15"></div>
            </div>
          </div>
          <div class="note-card__info">
            <div class="note-card__title">Test_1</div>
            <div class="note-card__date">5/6</div>
          </div>
        </article>

        <article class="note-card">
          <div class="note-card__thumbnail note-card__thumbnail--light">
            <div class="note-card__thumbnail-lines">
              <div class="thumbnail-line thumbnail-line--title thumbnail-line--w-65"></div>
              <div class="thumbnail-line thumbnail-line--w-50"></div>
              <div class="thumbnail-line thumbnail-line--w-40"></div>
              <div class="thumbnail-line thumbnail-line--w-70 thumbnail-line--opacity-30"></div>
              <div class="thumbnail-line thumbnail-line--w-55 thumbnail-line--opacity-25"></div>
            </div>
          </div>
          <div class="note-card__info">
            <div class="note-card__title">Test_2</div>
            <div class="note-card__date">5/6</div>
          </div>
        </article>

      </div>
    </main>

    <!-- 오버플로우 메뉴 -->
    <div class="overflow-menu" role="menu">
      <button class="overflow-menu__item" role="menuitem">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path d="M13 3L15 5L7 13H5V11L13 3Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
        </svg>
        선택
      </button>
      <button class="overflow-menu__item" role="menuitem">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <line x1="2" y1="4"  x2="16" y2="4"  stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          <line x1="2" y1="8"  x2="16" y2="8"  stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          <line x1="2" y1="12" x2="16" y2="12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          <line x1="2" y1="16" x2="16" y2="16" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        목록 보기
      </button>
      <button class="overflow-menu__item" role="menuitem">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path d="M9 2L10.8 6.8L16 7.2L12.2 10.6L13.4 15.8L9 13L4.6 15.8L5.8 10.6L2 7.2L7.2 6.8L9 2Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
        </svg>
        즐겨찾기 고정 해제
      </button>
      <div class="overflow-menu__divider"></div>
      <button class="overflow-menu__item" role="menuitem">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <rect x="2"  y="2"  width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.4"/>
          <rect x="10" y="2"  width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.4"/>
          <rect x="2"  y="10" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.4"/>
          <rect x="10" y="10" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.4"/>
        </svg>
        대시보드
      </button>
      <button class="overflow-menu__item" role="menuitem">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <circle cx="4"  cy="9"  r="2" stroke="currentColor" stroke-width="1.4"/>
          <circle cx="14" cy="4"  r="2" stroke="currentColor" stroke-width="1.4"/>
          <circle cx="14" cy="14" r="2" stroke="currentColor" stroke-width="1.4"/>
          <line x1="6"  y1="8"  x2="12" y2="5"  stroke="currentColor" stroke-width="1.3"/>
          <line x1="6"  y1="10" x2="12" y2="13" stroke="currentColor" stroke-width="1.3"/>
        </svg>
        지식 그래프
      </button>
      <button class="overflow-menu__item" role="menuitem">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <rect x="2" y="2" width="14" height="14" rx="2" stroke="currentColor" stroke-width="1.4"/>
          <rect x="5" y="5" width="3"  height="3"  rx="0.5" stroke="currentColor" stroke-width="1.2"/>
          <rect x="10" y="5" width="3" height="3"  rx="0.5" stroke="currentColor" stroke-width="1.2"/>
          <rect x="5"  y="10" width="3" height="3" rx="0.5" stroke="currentColor" stroke-width="1.2"/>
          <rect x="10" y="10" width="3" height="3" rx="0.5" stroke="currentColor" stroke-width="1.2"/>
        </svg>
        스크랩 보관함
      </button>
      <button class="overflow-menu__item" role="menuitem">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <circle cx="9" cy="9" r="7" stroke="currentColor" stroke-width="1.4"/>
          <circle cx="9" cy="9" r="2.5" stroke="currentColor" stroke-width="1.4"/>
        </svg>
        설정
      </button>
    </div>

  </div><!-- /app-main -->
</div><!-- /app-shell -->
</div><!-- /device-frame -->

<script src="js/main.js"></script>
</body>
</html>
