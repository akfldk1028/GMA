<!-- components/appbar.html — AppBar 컴포넌트 조각 -->
<header class="appbar">
  <button class="sidebar-toggle-btn" aria-label="사이드바 열기/닫기">
    <!-- 햄버거 아이콘 placeholder -->
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="2" y="5"  width="16" height="1.5" rx="1" fill="currentColor"/>
      <rect x="2" y="9"  width="16" height="1.5" rx="1" fill="currentColor"/>
      <rect x="2" y="13" width="16" height="1.5" rx="1" fill="currentColor"/>
    </svg>
  </button>

  <h1 class="appbar__title">모든 노트</h1>

  <div class="appbar__actions">
    <button class="appbar__icon-btn" data-action="search" aria-label="검색">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="8.5" cy="8.5" r="5.5" stroke="currentColor" stroke-width="1.5"/>
        <line x1="12.5" y1="12.5" x2="17" y2="17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </button>
    <button class="appbar__icon-btn" data-action="more" aria-label="더 보기">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="10" cy="4"  r="1.5" fill="currentColor"/>
        <circle cx="10" cy="10" r="1.5" fill="currentColor"/>
        <circle cx="10" cy="16" r="1.5" fill="currentColor"/>
      </svg>
    </button>
  </div>
</header>
