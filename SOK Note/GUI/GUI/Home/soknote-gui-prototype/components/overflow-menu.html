<!-- components/overflow-menu.html — OverflowMenu 컴포넌트 조각 -->
<div class="overflow-menu overflow-menu--open" role="menu">
  <button class="overflow-menu__item" role="menuitem">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="2" y="2" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.5"/>
      <line x1="5" y1="8" x2="11" y2="8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="8" y1="5" x2="8"  y2="11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    새 노트
  </button>
  <button class="overflow-menu__item" role="menuitem">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M2 11L5 14L14 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    선택 모드
  </button>
  <div class="overflow-menu__divider"></div>
  <button class="overflow-menu__item" role="menuitem">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.5"/>
      <line x1="8" y1="5" x2="8" y2="8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="8" cy="11" r="0.8" fill="currentColor"/>
    </svg>
    설정
  </button>
  <button class="overflow-menu__item overflow-menu__item--destructive" role="menuitem">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
      <polyline points="2,4 14,4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M5 4V3a1 1 0 011-1h4a1 1 0 011 1v1" stroke="currentColor" stroke-width="1.5"/>
      <rect x="3" y="4" width="10" height="9" rx="1" stroke="currentColor" stroke-width="1.5"/>
    </svg>
    전체 삭제
  </button>
</div>
