<!-- components/search-bar.html — SearchBar 컴포넌트 조각 -->
<div class="search-bar search-bar--active">
  <div class="search-bar__input-wrap">
    <svg class="search-bar__icon" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="6.5" cy="6.5" r="4.5" stroke="currentColor" stroke-width="1.5"/>
      <line x1="10" y1="10" x2="14" y2="14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <input class="search-bar__input" type="search" placeholder="노트 검색..." aria-label="노트 검색"/>
  </div>
  <button class="search-bar__cancel">취소</button>
</div>
