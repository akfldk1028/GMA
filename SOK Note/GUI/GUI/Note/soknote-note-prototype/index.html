<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>쏙 노트 — 노트 편집 GUI 프로토타입</title>
  <link rel="stylesheet" href="../../shared/css/reset.css" />
  <link rel="stylesheet" href="../../shared/css/tokens.css" />
  <link rel="stylesheet" href="../../shared/css/layout.css" />
  <link rel="stylesheet" href="../../shared/css/components.css" />
  <link rel="stylesheet" href="../../shared/css/note-editor.css" />
</head>
<body>

<div class="device-frame">
<div class="app-shell">
<div class="note-shell">

  <!-- ══════════════════════════
       상단 통합 헤더: 뒤로가기 + 제목 + 필기 도구 (한 줄) + 열린 문서 탭 (아래 줄)
       note-rail · note-editor · note-panel 전체 폭에 걸쳐 배치됨
  ══════════════════════════ -->
  <div class="note-topbar">
    <div class="note-topbar__row">
      <div class="note-topbar__breadcrumb">
        <button class="icon-btn" aria-label="뒤로">
          <svg width="20" height="20" viewBox="0 0 22 22" fill="none">
            <polyline points="14,5 8,11 14,17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <span class="note-topbar__title">[발표자료] 샘플 문서...</span>
        <span class="note-toolbar__sep"></span>
      </div>

      <!-- 필기 도구 -->
      <div class="note-toolbar__group">
        <button class="icon-btn icon-btn--active" aria-label="펜">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M3.7 16.3l.8-3.2 8.3-8.3a1.7 1.7 0 012.4 0l.9.9a1.7 1.7 0 010 2.4l-8.3 8.3-3.2.8z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
            <line x1="11.4" y1="6.2" x2="13.8" y2="8.6" stroke="currentColor" stroke-width="1.5"/>
          </svg>
        </button>
        <button class="icon-btn" aria-label="매직 완드">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <line x1="3.5" y1="16.5" x2="10.8" y2="9.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            <path d="M13.6 3l1 2.4 2.4 1-2.4 1-1 2.4-1-2.4-2.4-1 2.4-1 1-2.4z" fill="currentColor"/>
            <line x1="16.8" y1="11.2" x2="16.8" y2="14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            <line x1="15.4" y1="12.6" x2="18.2" y2="12.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            <line x1="6.5" y1="3.2" x2="6.5" y2="5.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            <line x1="5.3" y1="4.4" x2="7.7" y2="4.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </button>

        <span class="note-toolbar__sep"></span>

        <button class="color-swatch color-swatch--black color-swatch--active" aria-label="검정"></button>
        <button class="color-swatch color-swatch--red" aria-label="빨강"></button>
        <button class="color-swatch color-swatch--blue" aria-label="파랑"></button>
        <button class="color-swatch color-swatch--green" aria-label="초록"></button>
        <button class="color-swatch color-swatch--yellow" aria-label="노랑"></button>

        <span class="note-toolbar__sep"></span>

        <button class="size-dot size-dot--lg" aria-label="굵은 선"></button>
        <button class="size-dot size-dot--md size-dot--active" aria-label="중간 선"></button>
        <button class="size-dot size-dot--sm" aria-label="가는 선"></button>

        <span class="note-toolbar__sep"></span>

        <button class="icon-btn" aria-label="형광펜">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M7.5 9.2l-5 5v2.5h7.5l2.5-2.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M18.3 10l-3.8 3.8a1.65 1.65 0 01-2.33 0L7.83 9.47a1.65 1.65 0 010-2.33l3.84-3.84" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button class="icon-btn" aria-label="자르기">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M5 2v11a2 2 0 002 2h11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M15 18V7a2 2 0 00-2-2H2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
        <button class="icon-btn" aria-label="자유형 선택">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M4.5 13.5c1-4.5 4.5-8 7-7 2.3.9.4 4.1-1.7 5.2-1.9 1-2.2 3-.4 3.5 1.9.5 4.1-1 5.6-3.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </button>
        <button class="icon-btn" aria-label="빠른 실행">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M11 2L4 12h5l-1 6 7-10h-5l1-6z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
          </svg>
        </button>

        <span class="note-toolbar__sep"></span>

        <button class="icon-btn" aria-label="실행 취소">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <polyline points="7.5,3.5 3.5,7.5 7.5,11.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M3.5 7.5H12a4.25 4.25 0 010 8.5H9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </button>
        <button class="icon-btn" aria-label="다시 실행">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <polyline points="12.5,3.5 16.5,7.5 12.5,11.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M16.5 7.5H8a4.25 4.25 0 000 8.5h3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <!-- 링크 / 분할 / AI / 더보기 -->
      <div class="note-toolbar__group note-toolbar__group--end">
        <button class="icon-btn" aria-label="링크">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M8.3 10.8a4.2 4.2 0 006.3.5l2.5-2.5a4.2 4.2 0 00-5.9-5.9l-1.4 1.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M11.7 9.2a4.2 4.2 0 00-6.3-.5l-2.5 2.5a4.2 4.2 0 005.9 5.9l1.4-1.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button class="icon-btn" aria-label="레이아웃 분할">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <rect x="2" y="3" width="16" height="14" rx="1.8" stroke="currentColor" stroke-width="1.4"/>
            <rect x="3" y="4" width="6.2" height="12" rx="1" fill="currentColor"/>
          </svg>
        </button>
        <button class="icon-btn" data-action="ai-agent" aria-label="AI Agent">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M7.5 2l1.2 4 4 1.2-4 1.2-1.2 4-1.2-4-4-1.2 4-1.2L7.5 2z" fill="currentColor"/>
            <path d="M14.5 9.5l.8 2.4 2.4.8-2.4.8-.8 2.4-.8-2.4-2.4-.8 2.4-.8.8-2.4z" fill="currentColor"/>
            <path d="M14.8 2.8l.5 1.4 1.4.5-1.4.5-.5 1.4-.5-1.4-1.4-.5 1.4-.5.5-1.4z" fill="currentColor"/>
          </svg>
        </button>

        <div class="note-toolbar__more-wrap">
          <button class="icon-btn" data-action="more" aria-label="더 보기" aria-haspopup="menu">
            <svg width="20" height="20" viewBox="0 0 22 22" fill="none">
              <circle cx="11" cy="5"  r="1.5" fill="currentColor"/>
              <circle cx="11" cy="11" r="1.5" fill="currentColor"/>
              <circle cx="11" cy="17" r="1.5" fill="currentColor"/>
            </svg>
          </button>

          <!-- 더보기 드롭다운 (기존 overflow-menu 컴포넌트 재사용 + anchored 위치 변형) -->
          <div class="overflow-menu overflow-menu--anchored" role="menu">
            <button class="overflow-menu__item" role="menuitem">
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                <path d="M3 6h11M11.5 3.5L14 6l-2.5 2.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M15 12H4M6.5 9.5L4 12l2.5 2.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              레이아웃 전환
            </button>
            <button class="overflow-menu__item" role="menuitem">
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                <line x1="2" y1="4"  x2="16" y2="4"  stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                <line x1="2" y1="9"  x2="16" y2="9"  stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                <line x1="2" y1="14" x2="10" y2="14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              </svg>
              노트 편집기
            </button>
            <button class="overflow-menu__item" role="menuitem">
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                <rect x="3" y="2" width="9" height="12" rx="1.5" stroke="currentColor" stroke-width="1.3"/>
                <rect x="6" y="4" width="9" height="12" rx="1.5" fill="var(--color-surface)" stroke="currentColor" stroke-width="1.3"/>
              </svg>
              스크랩노트 관리
            </button>
            <button class="overflow-menu__item" role="menuitem">
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                <line x1="3" y1="3" x2="3" y2="15" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                <line x1="6" y1="5" x2="14" y2="5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
                <line x1="6" y1="9" x2="12" y2="9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
                <line x1="6" y1="13" x2="14" y2="13" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
              </svg>
              구조 보기
            </button>
            <button class="overflow-menu__item" role="menuitem">
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                <path d="M10.5 1.5H5.5A1.5 1.5 0 004 3v12a1.5 1.5 0 001.5 1.5h7A1.5 1.5 0 0014 15V5l-3.5-3.5z" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M10.5 1.5V5H14" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
                <line x1="9" y1="7.5" x2="9" y2="12.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
                <polyline points="6.9,10.4 9,12.5 11.1,10.4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              PDF 노트로 가져오기
            </button>
            <div class="overflow-menu__divider"></div>
            <button class="overflow-menu__item" role="menuitem">
              <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
                <circle cx="10" cy="10" r="6" stroke="currentColor" stroke-width="1.5"/>
                <circle cx="10" cy="10" r="2.2" stroke="currentColor" stroke-width="1.5"/>
                <line x1="17"    y1="10"    x2="18.8"  y2="10"    stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                <line x1="14.95" y1="14.95" x2="16.22" y2="16.22" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                <line x1="10"    y1="17"    x2="10"    y2="18.8"  stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                <line x1="5.05"  y1="14.95" x2="3.78"  y2="16.22" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                <line x1="3"     y1="10"    x2="1.2"   y2="10"    stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                <line x1="5.05"  y1="5.05"  x2="3.78"  y2="3.78"  stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                <line x1="10"    y1="3"     x2="10"    y2="1.2"   stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                <line x1="14.95" y1="5.05"  x2="16.22" y2="3.78"  stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              </svg>
              설정
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="note-topbar__tabstrip">
      <div class="note-tab note-tab--active">
        <svg class="note-tab__icon" width="14" height="14" viewBox="0 0 16 16" fill="none">
          <rect x="3" y="1.5" width="10" height="13" rx="1.5" stroke="currentColor" stroke-width="1.3"/>
          <line x1="5.5" y1="5" x2="10.5" y2="5" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
          <line x1="5.5" y1="8" x2="10.5" y2="8" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
        </svg>
        <span class="note-tab__label">[발표자료] 샘플 문서.pdf</span>
        <button class="note-tab__close" aria-label="탭 닫기">
          <svg width="12" height="12" viewBox="0 0 14 14" fill="none">
            <line x1="2" y1="2" x2="12" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="12" y1="2" x2="2" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <div class="note-content">

  <!-- ══════════════════════════
       Rail (좌측 탭 · 주석 목록)
  ══════════════════════════ -->
  <aside class="note-rail">
    <div class="note-rail__tabs">
      <button class="note-rail__tab note-rail__tab--active">전체</button>
      <button class="note-rail__tab">하이라이트</button>
      <button class="note-rail__tab">구조</button>
    </div>
    <div class="note-rail__list">아직 스크랩이 없습니다</div>
  </aside>

  <!-- ══════════════════════════
       Editor (중앙 문서 뷰어)
  ══════════════════════════ -->
  <div class="note-editor">

    <!-- 문서 페이지 스크롤 영역 -->
    <div class="note-editor__pages">

      <!-- 페이지 1: 커버 페이지 느낌의 generic placeholder (실제 문서 내용 없음) -->
      <article class="note-page">
        <div class="note-page__slide note-page__slide--cover">
          <button class="note-page__more" aria-label="페이지 옵션">
            <svg width="16" height="16" viewBox="0 0 22 22" fill="none">
              <circle cx="5"  cy="11" r="1.4" fill="currentColor"/>
              <circle cx="11" cy="11" r="1.4" fill="currentColor"/>
              <circle cx="17" cy="11" r="1.4" fill="currentColor"/>
            </svg>
          </button>
          <span class="pdf-ph__bar pdf-ph__bar--eyebrow"></span>
          <span class="pdf-ph__bar pdf-ph__bar--title"></span>
          <span class="pdf-ph__bar pdf-ph__bar--title-2"></span>
          <div class="pdf-ph__rule"></div>
          <span class="pdf-ph__bar pdf-ph__bar--sub"></span>
          <span class="pdf-ph__bar pdf-ph__bar--meta"></span>
        </div>
        <div class="pdf-ph__footer">
          <span class="pdf-ph__bar"></span>
          <span class="pdf-ph__bar"></span>
        </div>
      </article>

      <!-- 페이지 2: 콘텐츠 슬라이드 느낌의 generic placeholder (실제 문서 내용 없음) -->
      <article class="note-page">
        <div class="note-page__slide note-page__slide--content">
          <button class="note-page__more" aria-label="페이지 옵션">
            <svg width="16" height="16" viewBox="0 0 22 22" fill="none">
              <circle cx="5"  cy="11" r="1.4" fill="currentColor"/>
              <circle cx="11" cy="11" r="1.4" fill="currentColor"/>
              <circle cx="17" cy="11" r="1.4" fill="currentColor"/>
            </svg>
          </button>
          <span class="pdf-ph__bar pdf-ph__bar--heading"></span>
          <div class="pdf-ph__banner"></div>
          <div class="pdf-ph__body">
            <div class="pdf-ph__image" aria-hidden="true">
              <svg width="36" height="36" viewBox="0 0 24 24" fill="none">
                <rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor" stroke-width="1.5"/>
                <circle cx="9" cy="9" r="2" stroke="currentColor" stroke-width="1.5"/>
                <path d="M21 15l-5-5L5 21" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
              </svg>
            </div>
            <div class="pdf-ph__lines">
              <span class="pdf-ph__bar"></span>
              <span class="pdf-ph__bar pdf-ph__bar--w80"></span>
              <span class="pdf-ph__bar"></span>
              <span class="pdf-ph__bar pdf-ph__bar--w60"></span>
            </div>
          </div>
          <span class="pdf-ph__bar pdf-ph__bar--quote"></span>
        </div>
      </article>

    </div>

    <!-- 하단 플로팅 페이지 컨트롤: PDF 스크롤 콘텐츠가 아니라 뷰어에 고정된 조작 UI이므로
         note-editor__pages 밖, note-editor 직속 sibling으로 배치 -->
    <div class="page-nav">
      <button class="icon-btn icon-btn--sm" aria-label="이전 페이지">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <polyline points="9,2 4,7 9,12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <span class="page-nav__label">1 / 14</span>
      <button class="icon-btn icon-btn--sm" aria-label="다음 페이지">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <polyline points="5,2 10,7 5,12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <span class="note-toolbar__sep"></span>
      <button class="icon-btn icon-btn--sm" aria-label="축소">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <line x1="2" y1="7" x2="12" y2="7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
      <button class="icon-btn icon-btn--sm" aria-label="확대">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <line x1="7" y1="2" x2="7" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="2" y1="7" x2="12" y2="7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

  </div><!-- /note-editor -->

  <!-- ══════════════════════════
       Panel (우측 Scraps / AI Agent)
  ══════════════════════════ -->
  <aside class="note-panel">

    <!-- Scraps (기본 상태) -->
    <div class="note-panel__scraps-view">
      <div class="note-panel__header">
        <span class="note-panel__title">스크랩 <span class="note-panel__count">0</span></span>
        <div class="note-panel__actions">
          <button class="icon-btn icon-btn--sm" aria-label="레이아웃 전환">
            <svg viewBox="0 0 18 18" fill="none">
              <path d="M3 6h11M11.5 3.5L14 6l-2.5 2.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M15 12H4M6.5 9.5L4 12l2.5 2.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <button class="icon-btn icon-btn--sm" aria-label="펼치기">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
              <polyline points="6,3 11,8 6,13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <button class="icon-btn icon-btn--sm" aria-label="스크랩 추가">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
              <line x1="8" y1="3" x2="8" y2="13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              <line x1="3" y1="8" x2="13" y2="8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="note-panel__scraps" aria-label="스크랩 목록 (비어 있음)">
        <p class="note-panel__empty-hint">PDF에서 스크랩한 내용을 이곳에서 정리하세요</p>
      </div>
    </div>

    <!-- AI Agent (data-action="ai-agent" 클릭 시 표시) -->
    <div class="ai-agent">
      <div class="note-panel__header">
        <span class="ai-agent__title">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="none">
            <path d="M7.5 2l1.2 4 4 1.2-4 1.2-1.2 4-1.2-4-4-1.2 4-1.2L7.5 2z" fill="currentColor"/>
            <path d="M14.5 9.5l.8 2.4 2.4.8-2.4.8-.8 2.4-.8-2.4-2.4-.8 2.4-.8.8-2.4z" fill="currentColor"/>
            <path d="M14.8 2.8l.5 1.4 1.4.5-1.4.5-.5 1.4-.5-1.4-1.4-.5 1.4-.5.5-1.4z" fill="currentColor"/>
          </svg>
          AI 에이전트
        </span>
        <div class="note-panel__actions">
          <button class="icon-btn icon-btn--sm ai-agent__trash" aria-label="대화 삭제">
            <svg viewBox="0 0 18 18" fill="none">
              <path d="M3 5H15" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              <path d="M6.9 5V3.6a1.2 1.2 0 011.2-1.2h1.8a1.2 1.2 0 011.2 1.2V5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              <path d="M4.5 5l.7 9.6a1.5 1.5 0 001.5 1.4h4.6a1.5 1.5 0 001.5-1.4L13.5 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
              <line x1="7.6" y1="7.6" x2="7.6" y2="13" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
              <line x1="10.4" y1="7.6" x2="10.4" y2="13" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            </svg>
          </button>
          <button class="icon-btn icon-btn--sm" data-action="close-ai-agent" aria-label="닫기">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <line x1="2" y1="2" x2="12" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              <line x1="12" y1="2" x2="2" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="ai-agent__intro">
        <svg class="ai-agent__icon" width="28" height="28" viewBox="0 0 20 20" fill="none">
          <path d="M10 2l1.6 5.4L17 9l-5.4 1.6L10 16l-1.6-5.4L3 9l5.4-1.6L10 2z" fill="currentColor"/>
        </svg>
        <p class="ai-agent__desc">PDF 내용을 분석하고<br />다이어그램을 생성합니다</p>
      </div>

      <div class="ai-agent__chips">
        <div class="ai-agent__chips-row">
          <button class="chip">플로우차트</button>
          <button class="chip">마인드맵</button>
          <button class="chip">관계도</button>
        </div>
        <div class="ai-agent__chips-row">
          <button class="chip">비교표</button>
          <button class="chip">타임라인</button>
        </div>
      </div>

      <div class="ai-agent__footer">
        <button class="icon-btn ai-agent__skill" aria-label="스킬 선택">
          <svg viewBox="0 0 18 18" fill="none">
            <rect x="2" y="2" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.3"/>
            <rect x="11" y="2" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.3"/>
            <rect x="2" y="11" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.3"/>
            <rect x="11" y="11" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.3"/>
          </svg>
        </button>
        <input class="ai-agent__input" type="text" placeholder="메시지 입력 (또는 스킬 선택)" aria-label="AI Agent에게 메시지 입력" />
        <button class="ai-agent__send" aria-label="보내기">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M14.5 1.5l-4.6 13-2.6-5.9-5.8-2.6 13-4.5z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
            <path d="M14.5 1.5L7.3 8.6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>

  </aside><!-- /note-panel -->

  </div><!-- /note-content -->

</div><!-- /note-shell -->
</div><!-- /app-shell -->
</div><!-- /device-frame -->

<script src="js/main.js"></script>
</body>
</html>
