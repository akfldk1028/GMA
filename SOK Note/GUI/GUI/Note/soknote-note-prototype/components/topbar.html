<!-- components/topbar.html — 뒤로가기 + 필기 도구(한 줄) + 열린 문서 탭(아래 줄) (index.html 안 마크업의 참고용 사본) -->
<div class="note-topbar">
  <div class="note-topbar__row">
    <div class="note-topbar__breadcrumb">
      <button class="icon-btn" aria-label="뒤로">
        <svg width="20" height="20" viewBox="0 0 22 22" fill="none">
          <polyline points="14,5 8,11 14,17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <span class="note-topbar__title">[발표자료] Sample Document...</span>
      <span class="note-toolbar__sep"></span>
    </div>

    <!-- 필기 도구 그룹 — 상세 마크업은 toolbar.html 참고 -->
    <div class="note-toolbar__group"><!-- 펜 · 매직완드 · 색상 · 굵기 · 형광펜 · 자르기 · 도형 · 빠른실행 · 실행취소/다시실행 --></div>

    <!-- 우측 액션 그룹 -->
    <div class="note-toolbar__group note-toolbar__group--end">
      <button class="icon-btn" aria-label="링크">🔗</button>
      <button class="icon-btn" aria-label="레이아웃 분할">▥</button>
      <button class="icon-btn" data-action="ai-agent" aria-label="AI Agent">✨</button>
      <div class="note-toolbar__more-wrap">
        <button class="icon-btn" data-action="more" aria-label="더 보기" aria-haspopup="menu">⋮</button>
      </div>
    </div>
  </div>

  <div class="note-topbar__tabstrip">
    <div class="note-tab note-tab--active">
      <span class="note-tab__label">[발표자료] Sample Document.pdf</span>
      <button class="note-tab__close" aria-label="탭 닫기">×</button>
    </div>
  </div>
</div>
