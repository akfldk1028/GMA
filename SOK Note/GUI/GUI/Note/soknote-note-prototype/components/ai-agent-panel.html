<!-- components/ai-agent-panel.html — AI Agent 플로팅 패널 (index.html 안 마크업의 참고용 사본) -->
<!-- 우측 노트 영역(note-panel) 위에 뜨는 플로팅 패널: 400×520px, radius-lg, shadow-dialog, 우측 중앙 배치 -->
<!-- data-action="ai-agent" 클릭 시 ai-agent--active로 표시, data-action="close-ai-agent" 클릭 시 닫힘 (Scraps 뷰는 뒤에 그대로 보임) -->
<div class="ai-agent">
  <div class="note-panel__header">
    <span class="ai-agent__title">✨ AI Agent</span>
    <div class="note-panel__actions">
      <button class="icon-btn icon-btn--sm" aria-label="대화 삭제">🗑</button>
      <button class="icon-btn icon-btn--sm" data-action="close-ai-agent" aria-label="닫기">×</button>
    </div>
  </div>

  <div class="ai-agent__intro">
    <span class="ai-agent__icon">✨</span>
    <p class="ai-agent__desc">PDF 내용을 분석하고<br />다이어그램을 생성합니다</p>
  </div>

  <div class="ai-agent__chips">
    <div class="ai-agent__chips-row">
      <button class="chip">플로우차트</button>
      <button class="chip">마인드맵</button>
      <button class="chip">관계도</button>
    </div>
    <div class="ai-agent__chips-row">
      <button class="chip">비교표</button>
      <button class="chip">타임라인</button>
    </div>
  </div>

  <div class="ai-agent__footer">
    <button class="icon-btn" aria-label="스킬 선택">▦</button>
    <input class="ai-agent__input" type="text" placeholder="메시지 입력 (또는 스킬 선택)" />
    <button class="ai-agent__send" aria-label="보내기">➤</button>
  </div>
</div>
