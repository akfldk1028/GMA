<!-- components/scraps-panel.html — 우측 Scraps 패널 (index.html 안 마크업의 참고용 사본) -->
<!-- 항상 표시됨. aiAgentOpen 상태일 때는 이 뷰 위에 AI Agent 플로팅 패널(ai-agent-panel.html)이 뜬다. -->
<div class="note-panel__scraps-view">
  <div class="note-panel__header">
    <span class="note-panel__title">Scraps <span class="note-panel__count">0</span></span>
    <div class="note-panel__actions">
      <button class="icon-btn icon-btn--sm" aria-label="레이아웃 전환">⇄</button>
      <button class="icon-btn icon-btn--sm" aria-label="펼치기">›</button>
      <button class="icon-btn icon-btn--sm" aria-label="스크랩 추가">+</button>
    </div>
  </div>
  <div class="note-panel__scraps" aria-label="스크랩 목록 (비어 있음)">
    <p class="note-panel__empty-hint">PDF에서 스크랩한 내용을 이곳에서 정리하세요</p>
  </div>
</div>
